spring.application.name=BookMyShow

# ==========================================
# 1. MYSQL DATABASE CONNECTION
# ==========================================
# Replace 'localhost:3306' and 'my_database' with your server details
spring.jpa.ddl-auto=update
#spring.datasource.url=jdbc:mysql://localhost:3306/bookmyshow?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.url=jdbc:mysql://localhost:3306/bookmyshow?createDatabaseIfNotExist=true

# Database Credentials
spring.datasource.username=root
spring.datasource.password=root

# Modern MySQL Driver class (Required for MySQL 8.0+)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true

## ==========================================
## 2. HIBERNATE & SPRING DATA JPA SETTINGS
## ==========================================
## Database Platform Dialect (Forces Hibernate to use MySQL optimizations)
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
#
## DDL Auto: Options include none, validate, update, create, create-drop
## Use 'update' for dev, 'validate' or 'none' for production
#spring.jpa.hibernate.ddl-auto=update
#
## SQL Logging (Highly useful for debugging local queries)
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
#logging.level.org.hibernate.orm.jdbc.bind=trace

# ==========================================
# 3. HIKARI CONNECTION POOL PERFORMANCE
# ==========================================
## Maximum number of idle connections Hikari will maintain
#spring.datasource.hikari.minimum-idle=5
## Maximum number of connections allowed in the pool
#spring.datasource.hikari.maximum-pool-size=10
## Maximum time (ms) a connection can sit idle before being closed
#spring.datasource.hikari.idle-timeout=30000
## Maximum lifetime (ms) of a connection in the pool (Keep it shorter than MySQL's wait_timeout)
#spring.datasource.hikari.max-lifetime=1800000
## Maximum time (ms) your app will wait for a connection before throwing an exception
#spring.datasource.hikari.connection-timeout=30000
